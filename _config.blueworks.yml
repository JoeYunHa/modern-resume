          원자력 감시 계통(NIMS) 데이터 통합 처리 데스크톱 앱 **NIMS I/O Simulator** 개발.
          LPMS · ALMS · RCPVMS · IVMS 4종 시스템 + DMD 포맷 지원. 단독 전체 개발.

          **Python · Node.js · C++ 멀티 런타임 아키텍처** (채용공고 필수 스킬 3종 직접 적용)
          - Electron(Node.js) UI ↔ Python 파싱 엔진 ↔ C++ N-API Addon **4개 런타임 동시 운용**
          - 커스텀 바이너리 IPC 프로토콜 설계 (매직넘버 + 정렬 패딩 + 하이브리드 JSON/Binary): 전송 크기 **61% 감소**, 역직렬화 **218× 향상**
          - DLL 비스레드 안전 문제 → C++ 단일 전용 워커 스레드 + TSFN 패턴으로 해결
          - DMD 청크 스트리밍 + 동시성 제한 병렬 요청(concurrency=4)으로 대용량 처리
