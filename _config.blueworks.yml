        additional_links:
          - title: JoeYunHa/realgain_5_BE
            icon: fab fa-github
            url: https://github.com/JoeYunHa/realgain_5_BE
        description: |
          원자력 발전소 **RCP(냉각재 순환 펌프) 진동 감시 시스템 RCPVMS** 개발.
          Python 3.11 + PyTorch 기반 오프라인 AI 추론 엔진과 Electron 데스크톱 앱 단독 설계·구현.

          **AI 추론 파이프라인 설계**
          - **3계층 탐지 파이프라인:** 앙상블(ResNet18 + OrbitCNN1D) → OOD 탐지(max_conf + TV Distance) → Transformer MAE 재구성 오차. 각 계층 독립 Graceful Degradation
          - **물리 정보 인코딩:** Im(Gxy) 교차 스펙트럼 허수부로 와류 회전 방향을 4채널 스펙트로그램에 명시 인코딩 (H-flip 증강 금지로 물리 정보 보존)
          - **XAI:** Integrated Gradients(30-step) + GradCAM 히트맵으로 예측 근거 시각화
          - Grid Search 가중치 자동 최적화: 목적함수 `val_acc × (1 − ood_fp_rate)`

          **실시간 추론 서버 설계 (로봇제어 응용 가능 구조)**
          - **Python Daemon Pool (Hot-Standby):** 모델 사전 적재로 콜드 스타트 비용 0, 워커 크래시 자동 재시작·idle 복귀, 동적 pool.resize(1~4)
          - Node.js IPC ↔ Python inference daemon 간 커스텀 바이너리 프로토콜로 저지연 통신

      - layout: left
        title: RealGain
